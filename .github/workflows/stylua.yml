name: Check Lua formatting

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  stylua-check:
    name: StyLua
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Check Lua formatting
        uses: JohnnyMorganz/stylua-action@v5
        with:
          version: latest
          args: --check .
